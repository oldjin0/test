<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120b22">
<title>메아리 던전</title>
<style>
:root{--u:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120b22;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#1b1230}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.u{font-size:calc(var(--u)*15px)}
.scr{position:absolute;inset:0;display:none;color:#fff;text-align:center;font-size:calc(var(--u)*15px)}
.scr.on{display:block}
.center{display:none;flex-direction:column;align-items:center;justify-content:center}
.center.on{display:flex}
.dim{background:rgba(14,6,28,.82)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{font-weight:900;color:#3a1c4a;background:linear-gradient(#ffe27a,#ffb23e);border:calc(var(--u)*3px) solid #3a2540;border-radius:calc(var(--u)*18px);padding:calc(var(--u)*12px) calc(var(--u)*30px);font-size:calc(var(--u)*22px);box-shadow:0 calc(var(--u)*5px) 0 #8a4a1c}
.btn:active{transform:translateY(calc(var(--u)*3px));box-shadow:0 calc(var(--u)*2px) 0 #8a4a1c}
.btn:disabled{filter:grayscale(1) brightness(.7)}
.btn2{font-weight:800;background:#3b2a5a;color:#e9ddff;border:calc(var(--u)*2px) solid #6a52a0;border-radius:calc(var(--u)*14px);padding:calc(var(--u)*8px) calc(var(--u)*16px);font-size:calc(var(--u)*15px);box-shadow:0 calc(var(--u)*4px) 0 #1c1230}
.btn2:active{transform:translateY(calc(var(--u)*2px));box-shadow:0 calc(var(--u)*2px) 0 #1c1230}
.btn2:disabled{opacity:.45}
h2{margin:0 0 calc(var(--u)*12px);font-size:calc(var(--u)*24px);color:#ffe9a8;text-shadow:0 calc(var(--u)*2px) 0 #5a2a6a}
/* 타이틀 */
#title .top{position:absolute;left:calc(var(--u)*12px);right:calc(var(--u)*12px);top:calc(var(--u)*12px);display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(0,0,0,.5);border:calc(var(--u)*2px) solid #6a52a0;border-radius:calc(var(--u)*20px);padding:calc(var(--u)*4px) calc(var(--u)*12px);font-weight:800;color:#ffd34a}
.icon{width:calc(var(--u)*40px);height:calc(var(--u)*40px);border-radius:50%;background:rgba(0,0,0,.5);border:calc(var(--u)*2px) solid #6a52a0;font-size:calc(var(--u)*20px);padding:0}
.logo{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{margin-top:calc(var(--u)*-6px)}}
@keyframes glow{50%{box-shadow:0 calc(var(--u)*5px) 0 #8a4a1c,0 0 calc(var(--u)*18px) rgba(255,210,90,.75)}}
#start:not(:disabled){animation:glow 1.8s ease-in-out infinite}
.logo{position:absolute;left:0;right:0;top:calc(var(--u)*62px);font-size:calc(var(--u)*46px);font-weight:900;line-height:1.02;color:#ffe9a8;text-shadow:0 calc(var(--u)*4px) 0 #7a3b86,0 0 calc(var(--u)*22px) #b06cff;letter-spacing:calc(var(--u)*-1px)}
.tag{position:absolute;left:0;right:0;top:calc(var(--u)*168px);color:#cdbbff;font-size:calc(var(--u)*13px)}
.chap{position:absolute;left:calc(var(--u)*18px);right:calc(var(--u)*18px);top:calc(var(--u)*200px);display:flex;align-items:center;gap:calc(var(--u)*8px)}
.chap .arrow{width:calc(var(--u)*38px);height:calc(var(--u)*76px);border-radius:calc(var(--u)*12px);background:rgba(0,0,0,.45);border:calc(var(--u)*2px) solid #6a52a0;font-size:calc(var(--u)*20px);padding:0;color:#fff}
.chap .arrow:disabled{opacity:.25}
.chapbox{flex:1;background:rgba(20,10,40,.78);border:calc(var(--u)*2.5px) solid #8a6cff;border-radius:calc(var(--u)*16px);padding:calc(var(--u)*8px);min-height:calc(var(--u)*76px)}
.chapbox .n{font-size:calc(var(--u)*12px);color:#b9a6e8}
.chapbox .t{font-size:calc(var(--u)*20px);font-weight:900}
.chapbox .s{font-size:calc(var(--u)*12px);color:#d9ccff;margin-top:calc(var(--u)*2px)}
.adbtn{margin:0 0 calc(var(--u)*10px);border-color:#ffd34a;color:#ffe9a8}
.adbtn:empty{display:none}
#codeIn{width:100%;height:calc(var(--u)*90px);margin-top:calc(var(--u)*8px);font:calc(var(--u)*11px) monospace;border-radius:calc(var(--u)*8px);border:0;padding:calc(var(--u)*6px)}
.endless{border-color:#c9a23a;color:#ffe9a8}
.endless.on{background:#ffd34a;color:#3a1c4a}
.charbtn{position:absolute;left:calc(var(--u)*18px);right:calc(var(--u)*18px);top:calc(var(--u)*288px);height:calc(var(--u)*78px);display:flex;align-items:center;gap:calc(var(--u)*12px);padding:0 calc(var(--u)*14px);border-radius:calc(var(--u)*16px);background:linear-gradient(rgba(60,40,100,.92),rgba(30,18,60,.92));border:calc(var(--u)*2.5px) solid #ffd34a;text-align:left;box-shadow:0 calc(var(--u)*4px) 0 rgba(0,0,0,.4)}
.charbtn img{height:calc(var(--u)*64px);width:calc(var(--u)*64px);object-fit:contain;filter:drop-shadow(0 calc(var(--u)*3px) 0 rgba(0,0,0,.4))}
.charbtn b{display:block;font-size:calc(var(--u)*18px)}
.charbtn small{display:block;color:#cdbbff;font-size:calc(var(--u)*12px);font-weight:600;line-height:1.25}
.charbtn .chg{margin-left:auto;font-size:calc(var(--u)*12px);color:#ffe9a8;font-weight:800;white-space:nowrap}
.cstage{position:relative;flex:none;height:calc(var(--u)*186px);display:flex;align-items:flex-end;justify-content:center}
.cglow{position:absolute;left:50%;bottom:calc(var(--u)*10px);width:calc(var(--u)*190px);height:calc(var(--u)*60px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(255,211,74,.55),rgba(255,211,74,0) 70%)}
#cimg{position:relative;height:calc(var(--u)*178px);animation:cbob 1.6s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 calc(var(--u)*6px) calc(var(--u)*6px) rgba(0,0,0,.5))}
@keyframes cbob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
#chars{color:#fff;text-align:center}
.cinfo{text-align:center;font-size:calc(var(--u)*22px);margin-top:calc(var(--u)*4px)}
.cinfo span{font-size:calc(var(--u)*13px);color:#ffd34a;font-weight:800;margin-left:calc(var(--u)*6px)}
#cdesc{text-align:center;color:#d9ccff;font-size:calc(var(--u)*12.5px);line-height:1.35;margin:calc(var(--u)*4px) calc(var(--u)*8px) calc(var(--u)*8px)}
#cstats{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*5px) calc(var(--u)*10px);align-items:center;margin:0 calc(var(--u)*10px) calc(var(--u)*10px);font-size:calc(var(--u)*12px);color:#cdbbff;text-align:left}
.sbar{height:calc(var(--u)*9px);border-radius:calc(var(--u)*5px);background:rgba(0,0,0,.45);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7dff9a,#ffe27a);transition:width .25s}
#ctabs{display:flex;gap:calc(var(--u)*8px);margin-bottom:calc(var(--u)*10px)}
#ctabs button{flex:1;padding:calc(var(--u)*4px) 0;border-radius:calc(var(--u)*12px);background:rgba(20,10,40,.78);border:calc(var(--u)*2px) solid #4a3a7a;font-weight:800;line-height:1.15}
#ctabs button.on{border-color:#ffd34a;background:rgba(80,50,120,.9)}
#ctabs .ico{height:calc(var(--u)*38px);width:calc(var(--u)*38px);margin:0 auto}
.cls{position:absolute;left:calc(var(--u)*18px);right:calc(var(--u)*18px);top:calc(var(--u)*284px);display:flex;gap:calc(var(--u)*8px)}
.cls button{flex:1;padding:calc(var(--u)*4px) 0;border-radius:calc(var(--u)*12px);background:rgba(20,10,40,.78);border:calc(var(--u)*2px) solid #4a3a7a;font-weight:800;line-height:1.15}
.cls button.on{border-color:#ffd34a;background:rgba(80,50,120,.9);box-shadow:0 0 calc(var(--u)*10px) rgba(255,211,74,.45)}
.cls .i{display:block;font-size:calc(var(--u)*22px);height:calc(var(--u)*34px);width:calc(var(--u)*34px);margin:0 auto}
.ico{width:100%;height:100%;object-fit:contain;display:block}
.cls small{display:block;color:#cdbbff;font-size:calc(var(--u)*11px);font-weight:600}
.clsinfo{position:absolute;left:calc(var(--u)*22px);right:calc(var(--u)*22px);top:calc(var(--u)*364px);font-size:calc(var(--u)*11.5px);color:#d9ccff;line-height:1.3}
.echoes{position:absolute;left:0;right:0;top:calc(var(--u)*404px);font-size:calc(var(--u)*13px);color:#bfeeff}
.nem{position:absolute;left:calc(var(--u)*30px);right:calc(var(--u)*30px);top:calc(var(--u)*428px);padding:calc(var(--u)*5px) calc(var(--u)*10px);border-radius:calc(var(--u)*10px);background:rgba(255,60,90,.18);border:calc(var(--u)*1.5px) solid #ff4d6d;color:#ffb3c0;font-size:calc(var(--u)*12.5px)}
#start{position:absolute;left:calc(var(--u)*60px);right:calc(var(--u)*60px);top:calc(var(--u)*516px)}
.nav{position:absolute;left:calc(var(--u)*16px);right:calc(var(--u)*16px);bottom:calc(var(--u)*22px);display:flex;gap:calc(var(--u)*10px)}
.nav button{flex:1;position:relative}
.badge{position:absolute;top:calc(var(--u)*-6px);right:calc(var(--u)*-4px);background:#ff4d6d;color:#fff;border-radius:calc(var(--u)*10px);font-size:calc(var(--u)*11px);padding:0 calc(var(--u)*6px);line-height:calc(var(--u)*18px)}
/* 메뉴 공통 */
.menu{position:absolute;inset:0;background:rgba(14,6,28,.94);padding:calc(var(--u)*16px);display:none;flex-direction:column}
.menu.on{display:flex}
.menu .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(var(--u)*10px)}
.menu .head h2{margin:0}
.list{flex:1;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:calc(var(--u)*8px);padding-bottom:calc(var(--u)*8px)}
.item{display:flex;align-items:center;gap:calc(var(--u)*10px);background:linear-gradient(#3a2866,#2a1d4a);border:calc(var(--u)*2px) solid #6a52a0;border-radius:calc(var(--u)*14px);padding:calc(var(--u)*10px);text-align:left}
.item .ic{font-size:calc(var(--u)*28px);width:calc(var(--u)*44px);height:calc(var(--u)*44px);text-align:center}
.item .tx{flex:1}
.item b{display:block;font-size:calc(var(--u)*15px)}
.item small{display:block;color:#cdbbff;font-size:calc(var(--u)*12px)}
.item .lv{color:#ffe27a;font-size:calc(var(--u)*11px)}
.bar{height:calc(var(--u)*6px);border-radius:calc(var(--u)*3px);background:rgba(0,0,0,.4);margin-top:calc(var(--u)*5px);overflow:hidden}
.bar i{display:block;height:100%;background:#7dff9a}
.buy{min-width:calc(var(--u)*76px);font-size:calc(var(--u)*13px);padding:calc(var(--u)*8px) calc(var(--u)*8px)}
.set{display:flex;justify-content:space-between;align-items:center;background:#2a1d4a;border-radius:calc(var(--u)*12px);padding:calc(var(--u)*10px) calc(var(--u)*14px);font-size:calc(var(--u)*15px)}
.tog{width:calc(var(--u)*58px);height:calc(var(--u)*30px);border-radius:calc(var(--u)*15px);border:none;background:#4a3a6a;position:relative;padding:0}
.tog::after{content:'';position:absolute;top:calc(var(--u)*3px);left:calc(var(--u)*3px);width:calc(var(--u)*24px);height:calc(var(--u)*24px);border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#59d07a}
.tog.on::after{left:calc(var(--u)*31px)}
input{font:inherit;font-size:calc(var(--u)*15px);width:calc(var(--u)*120px);text-align:center;padding:calc(var(--u)*5px);border-radius:calc(var(--u)*10px);border:calc(var(--u)*2px) solid #7a5cc0;background:#1a1030;color:#fff;user-select:text;-webkit-user-select:text}
.ver{color:#8a7ab0;font-size:calc(var(--u)*11px);margin-top:calc(var(--u)*8px)}
/* 카드 */
.card{width:calc(var(--u)*300px);margin:calc(var(--u)*6px) 0;padding:calc(var(--u)*11px);color:#fff;text-align:left;background:linear-gradient(#4a3380,#2e2050);border:calc(var(--u)*3px) solid #b9c2d9;border-radius:calc(var(--u)*16px);box-shadow:0 calc(var(--u)*4px) 0 #170c2e;display:flex;gap:calc(var(--u)*12px);align-items:center;animation:pop .25s ease-out both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
@keyframes legend{50%{box-shadow:0 calc(var(--u)*4px) 0 #170c2e,0 0 calc(var(--u)*22px) rgba(255,107,93,.9)}}
.card.legend{background:linear-gradient(135deg,#7a2a3a,#3a1a50 60%,#7a5a1a);animation:pop .25s ease-out both,legend 1.4s ease-in-out .3s infinite}
.card:active{transform:translateY(calc(var(--u)*2px))}
.card .ic{font-size:calc(var(--u)*32px);width:calc(var(--u)*46px);height:calc(var(--u)*46px);text-align:center;flex:none}
.card b{font-size:calc(var(--u)*17px);display:block}
.card span{font-size:calc(var(--u)*12.5px);color:#d9ccff;display:block}
.card em{font-style:normal;font-size:calc(var(--u)*11px);font-weight:800}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
/* 결과 */
.stat{max-width:calc(var(--u)*310px);line-height:1.7;font-size:calc(var(--u)*15px);color:#e9ddff;margin-bottom:calc(var(--u)*14px)}
.stat em{color:#ffe27a;font-style:normal;font-weight:800}
.stat .hl{display:block;margin-top:calc(var(--u)*6px);padding:calc(var(--u)*6px);border-radius:calc(var(--u)*10px);background:rgba(255,255,255,.07);font-size:calc(var(--u)*13.5px)}
.row{display:flex;gap:calc(var(--u)*10px);margin-top:calc(var(--u)*12px)}
#pauseBtn{position:absolute;right:calc(var(--u)*10px);top:calc(var(--u)*5px);width:calc(var(--u)*30px);height:calc(var(--u)*30px);display:none;font-size:calc(var(--u)*13px)}
#pauseBtn.on{display:block}
#toast{position:absolute;left:50%;top:calc(var(--u)*90px);transform:translateX(-50%);background:rgba(20,10,40,.92);border:calc(var(--u)*2px) solid #ffd34a;color:#ffe9a8;padding:calc(var(--u)*8px) calc(var(--u)*14px);border-radius:calc(var(--u)*12px);font-size:calc(var(--u)*14px);font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#modal .box{background:#2a1d4a;border:calc(var(--u)*2px) solid #8a6cff;border-radius:calc(var(--u)*16px);padding:calc(var(--u)*18px);width:calc(var(--u)*290px);line-height:1.6}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cdbbff;background:#120b22;font-size:16px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="title" class="scr">
    <div class="top"><span class="pill" id="tgold">🪙 0</span><button class="icon" id="tset" aria-label="설정">⚙️</button></div>
    <div class="logo">메아리<br>던전</div>
    <div class="tag">한 판이 끝나면, 과거의 내가 동료가 된다</div>
    <div class="chap">
      <button class="arrow" id="cprev" aria-label="이전 챕터">◀</button>
      <div class="chapbox"><div class="n" id="cnum"></div><div class="t" id="cname"></div><div class="s" id="cinfo"></div></div>
      <button class="arrow" id="cnext" aria-label="다음 챕터">▶</button>
    </div>
    <button class="charbtn" id="tcharBtn" aria-label="캐릭터 선택"></button>
    <div class="echoes" id="techo"></div>
    <div class="nem" id="tnem" style="display:none"></div>
    <button class="btn" id="start">출발!</button>
    <div class="nav">
      <button class="btn2" id="tshop">⬆ 강화</button>
      <button class="btn2 endless" id="tendless">♾ 생존</button>
      <button class="btn2" id="tmis">📜 임무<span class="badge" id="misBadge" style="display:none">!</span></button>
    </div>
  </div>

  <div id="shop" class="menu">
    <div class="head"><h2>영구 강화</h2><span class="pill" id="sgold">🪙 0</span></div>
    <div class="list" id="shopList"></div>
    <button class="btn2" data-back>돌아가기</button>
  </div>

  <div id="missions" class="menu">
    <div class="head"><h2>오늘의 임무</h2><span class="pill" id="mgold">🪙 0</span></div>
    <div class="list" id="misList"></div>
    <div class="ver">임무는 매일 자정에 바뀝니다</div>
    <button class="btn2" data-back style="margin-top:8px">돌아가기</button>
  </div>

  <div id="settings" class="menu">
    <div class="head"><h2>설정</h2></div>
    <div class="list">
      <div class="set"><span>이름</span><input id="nameIn" maxlength="8" autocomplete="off"></div>
      <div class="set"><span>효과음</span><button class="tog" data-set="sfx" aria-label="효과음"></button></div>
      <div class="set"><span>배경음악</span><button class="tog" data-set="music" aria-label="배경음악"></button></div>
      <div class="set"><span>진동</span><button class="tog" data-set="vib" aria-label="진동"></button></div>
      <div class="set"><span>화면 흔들림</span><button class="tog" data-set="shake" aria-label="화면 흔들림"></button></div>
      <div class="set"><span>기록</span><span id="statLine" style="font-size:calc(var(--u)*12px);color:#cdbbff"></span></div>
      <button class="btn2" id="friendBtn">👥 친구 메아리 코드 넣기</button>
      <button class="btn2" id="privBtn">개인정보처리방침</button>
      <button class="btn2" id="resetBtn" style="background:#5a2a3a;border-color:#a04a6a">데이터 초기화</button>
      <div class="ver" id="ver"></div>
    </div>
    <button class="btn2" data-back>돌아가기</button>
  </div>

  <div id="pick" class="scr center dim">
    <h2 id="pickTitle">카드를 고르세요</h2>
    <div id="cards"></div>
    <button class="btn2" id="rerollBtn" style="margin-top:10px">🎲 다시 뽑기</button>
  </div>

  <div id="pause" class="scr center dim">
    <h2>일시정지</h2>
    <button class="btn" id="resume">계속하기</button>
    <div class="row"><button class="btn2" id="psettings">설정</button><button class="btn2" id="quit">포기하기</button></div>
  </div>

  <div id="result" class="scr center dim">
    <h2 id="rtitle"></h2>
    <div class="stat" id="rstat"></div>
    <button class="btn2 adbtn" id="rdouble"></button>
    <button class="btn" id="again">다시 도전</button>
    <div class="row"><button class="btn2" id="rshop">⬆ 강화</button><button class="btn2" id="rshare">📤 메아리 공유</button><button class="btn2" id="home">타이틀</button></div>
  </div>

  <div id="chars" class="menu">
    <div class="head"><h2>캐릭터 선택</h2></div>
    <div class="cstage"><div class="cglow"></div><img id="cimg" alt=""></div>
    <div class="cinfo"><b id="cname2"></b> <span id="ctag2"></span></div>
    <div id="cdesc"></div>
    <div id="cstats"></div>
    <div id="ctabs"></div>
    <button class="btn" id="cpick">이 캐릭터로 출발</button>
    <button class="btn2" data-back style="margin-top:8px">돌아가기</button>
  </div>

  <div id="revive" class="scr center dim">
    <h2>쓰러졌다…</h2>
    <div class="stat">광고를 보면 체력 절반으로 다시 일어섭니다<br><small>판마다 한 번</small></div>
    <button class="btn" id="revAd">📺 광고 보고 부활</button>
    <button class="btn2" id="revNo" style="margin-top:12px">그만하기</button>
  </div>
