name: Build colorizer model

on:
  workflow_dispatch:
  push:
    branches: [ccr-4d8e098a-xfwocj]
    paths: [tools/model/**, .github/workflows/build-model.yml]

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install converters
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install tensorflow-cpu==2.21.0 tf_keras==2.21.0 onnx==1.23.1 onnxruntime==1.30.0 \
            onnxsim==0.7.3 onnx2tf==1.28.8 sng4onnx onnx_graphsurgeon psutil ai_edge_litert \
            pillow scikit-image numpy opencv-python-headless gdown
      - name: Fetch manga-colorization-v2 code and generator weights
        run: |
          git clone --depth 1 https://github.com/qweasdd/manga-colorization-v2 /tmp/mcv2
          gdown 1qmxUEKADkEM4iYLp1fpPLLKnfZ6tcF-t -O /tmp/mcv2/networks/generator.zip
          ls -la /tmp/mcv2/networks
          # Guard against an HTML error page instead of the weights.
          test $(stat -c %s /tmp/mcv2/networks/generator.zip) -gt 50000000
      - name: Convert and verify against PyTorch
        working-directory: tools/model
        env:
          PYTHONPATH: /tmp/mcv2
        run: python convert_manga.py --weights /tmp/mcv2/networks/generator.zip --width 448 --out ../../assets/models/colorizer.tflite
      - name: Preview on sample images
        working-directory: tools/model
        run: |
          python fetch_samples.py /tmp/samples
          mkdir -p ../../docs
          python preview.py ../../assets/models/colorizer.tflite ../../docs/colorize_preview.png /tmp/samples/*
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/colorizer.tflite docs/colorize_preview.png
          git diff --cached --quiet || git commit -m "Add converted manga colorizer.tflite and preview"
          git push
