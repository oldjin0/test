name: Build Windows

# Builds the PC version, tests it on Windows with the real native libraries
# (ONNX Runtime, pdfium, the system tar), and packages MangaViewer-windows.zip.
on:
  push:
    branches: [ccr-4d8e098a-xfwocj]
    paths:
      - lib/**
      - windows/**
      - pubspec.yaml
      - pubspec.lock
      - assets/**
      - test/**
      - integration_test/**
      - tools/pc/**
      - .github/workflows/build-windows.yml
      - .github/workflows/pc-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    uses: ./.github/workflows/pc-export.yml

  build:
    needs: export
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze_log.txt || true
          echo "## Flutter Analyze Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 40 analyze_log.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests (on Windows)
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test_log.txt || {
            echo "## Unit Tests Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "(FAILED|Expected:|Actual:|Which:|Error:)" test_log.txt -A 2 -B 1 | head -n 100 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          name: onnx
          path: onnx
      - name: Native libraries (ONNX Runtime with DirectML, pdfium)
        shell: pwsh
        run: |
          New-Item -ItemType Directory libs | Out-Null
          # The wheel the benchmark ran on: onnxruntime.dll (DirectML build) and DirectML.dll.
          pip download onnxruntime-directml==1.24.4 --no-deps --only-binary=:all: -d wheels
          Copy-Item (Get-ChildItem wheels/*.whl).FullName wheels/ort.zip
          Expand-Archive wheels/ort.zip -DestinationPath wheels/ort
          Copy-Item wheels/ort/onnxruntime/capi/onnxruntime.dll, wheels/ort/onnxruntime/capi/DirectML.dll libs/
          # pdfium (Chromium's PDF renderer) prebuilt for Windows.
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          New-Item -ItemType Directory libs/pdfium | Out-Null
          tar -xzf pdfium.tgz -C libs/pdfium
          Copy-Item libs/pdfium/bin/pdfium.dll libs/
          Get-ChildItem libs | Format-Table Name, Length
      - name: Build
        env:
          # permission_handler_windows uses <experimental/coroutine>, which the newest MSVC rejects
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
      - name: Integration test on Windows (real DLLs)
        shell: pwsh
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          MANGA_MODEL_DIR: ${{ github.workspace }}\onnx
          ORT_LIBRARY: ${{ github.workspace }}\libs\onnxruntime.dll
          PDFIUM_LIBRARY: ${{ github.workspace }}\libs\pdfium.dll
        run: flutter test integration_test/pc_test.dart -d windows --reporter expanded
      - name: Package
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Copy-Item libs/onnxruntime.dll, libs/DirectML.dll, libs/pdfium.dll $rel
          # The Visual C++ runtime the program and onnxruntime.dll need: PCs without
          # the redistributable installed would not start the program otherwise
          # (app-local copies are allowed by Microsoft).
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot/System32/$dll" $rel
          }
          New-Item -ItemType Directory "$rel/models" | Out-Null
          Copy-Item onnx/colorizer_fp32.onnx, onnx/colorizer_fp16.onnx, onnx/denoiser.onnx "$rel/models"
          $viewerExe = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("7LGE7IOJ67ew7Ja0LmV4ZQ=="))
          $autoExe = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("7Jik7Yag7LGE7IOJ6riwLmV4ZQ=="))
          Set-Content -Path "$rel/version.json" -Value '{"code": ${{ github.run_number }}, "name": "1.0.${{ github.run_number }}"}'
          Copy-Item "$rel/manga_viewer.exe" "$rel/$viewerExe"
          Copy-Item "$rel/manga_viewer.exe" "$rel/$autoExe"
          Set-Content -Path "$rel/README.txt" -Encoding utf8 -Value "Manga Viewer & Auto Colorizer Windows Release`n`n- manga_viewer.exe: Default launcher`n- ${viewerExe}: Manga Viewer launcher`n- ${autoExe}: Standalone Auto Colorizer launcher"
          Get-ChildItem $rel | Format-Table Name, Length
          # bsdtar 로 만들면 조용히 종료코드 1로 실패하는 사례가 반복되어(한글 파일명
          # 처리) .NET ZipFile API 로 교체 - 한글 이름은 UTF-8 플래그로 보존되며
          # 탐색기·앱 업데이터(bsdtar) 모두 정상 읽는다.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path (Get-Location) "MangaViewer-windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $rel).Path, $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          "{0:N0} MB" -f ((Get-Item $zipPath).Length / 1MB)
      - name: The packaged program starts and stays up
        shell: pwsh
        run: |
          # Unpack with .NET (locale-independent - bsdtar on en-US runners cannot
          # decode the Korean launcher names in the UTF-8 zip) and start that
          # copy: proves the archive itself is complete and readable.
          $viewerExe = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("7LGE7IOJ67ew7Ja0LmV4ZQ=="))
          $autoExe = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("7Jik7Yag7LGE7IOJ6riwLmV4ZQ=="))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory unpacked | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory(
            (Resolve-Path "MangaViewer-windows.zip").Path,
            (Resolve-Path "unpacked").Path)
          foreach ($f in 'manga_viewer.exe', $viewerExe, $autoExe, 'data/app.so', 'flutter_windows.dll', 'models/colorizer_fp32.onnx', 'vcruntime140_1.dll', 'version.json') {
            if (-not (Test-Path (Join-Path "unpacked" $f))) { throw "missing in the zip: $f" }
          }
          $exe = (Resolve-Path "unpacked/manga_viewer.exe").Path
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "manga_viewer.exe exited with code $($p.ExitCode)" }
          Write-Output "running: $($p.MainWindowTitle)"
          Stop-Process $p -Force
          $autoPath = (Resolve-Path (Join-Path "unpacked" $autoExe)).Path
          $p2 = Start-Process $autoPath -PassThru
          Start-Sleep -Seconds 8
          if ($p2.HasExited) { throw "$autoExe exited with code $($p2.ExitCode)" }
          Write-Output "running auto colorizer: $($p2.MainWindowTitle)"
          Stop-Process $p2 -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MangaViewer-windows
          path: MangaViewer-windows.zip
          compression-level: 0

  # Publishes the zip the PC version's updater downloads (a pre-release, so the
  # phone's "latest" never changes), only when the build and its tests passed.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MangaViewer-windows
          path: dist
      - name: Publish pc-${{ github.run_number }}
        run: |
          set -euo pipefail
          # The token cannot tag a commit whose workflow files differ from the branch
          # head; the newer commit's own build publishes instead.
          HEAD=$(gh api "repos/$REPO/commits/${{ github.ref_name }}" -q .sha)
          CHANGED=$(gh api "repos/$REPO/compare/${{ github.sha }}...$HEAD" \
            -q '[.files[]?.filename | select(startswith(".github/workflows/"))] | length')
          if [ "$CHANGED" != "0" ]; then
            echo "::notice::Workflows changed after this commit; the newer build publishes."
            exit 0
          fi
          (cd dist && sha256sum MangaViewer-windows.zip > SHA256SUMS && cat SHA256SUMS)
          git log -1 --format='%s%n%n%b' | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md || true
          gh release create "pc-${{ github.run_number }}" dist/MangaViewer-windows.zip dist/SHA256SUMS \
            --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Manga Viewer PC 1.0.${{ github.run_number }}" --notes-file notes.md
      - name: Keep only the 3 newest PC builds
        run: |
          set -euo pipefail
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft,createdAt \
            -q '[.[] | select(.isDraft | not) | select(.tagName | test("^pc-[0-9]+$"))]
                | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r TAG; do
            echo "Deleting old release $TAG"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          done
