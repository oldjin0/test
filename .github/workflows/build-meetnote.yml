name: Build MeetNote APK

on:
  push:
    branches: [ccr-c70ea6bc-1gfxyi]
    paths:
      - meeting-recorder/**
      - .github/workflows/build-meetnote.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: meeting-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch sherpa-onnx native libs (on-device speech recognition)
        run: |
          V=1.13.8
          curl -fsSL -o sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-$V.aar \
            || curl -fsSL -o sherpa.aar https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-$V.aar
          rm -rf aarx && mkdir aarx && unzip -q sherpa.aar 'jni/*' -d aarx
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp -v aarx/jni/$abi/*.so app/src/main/jniLibs/$abi/
          done
          rm -rf aarx sherpa.aar
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MeetNote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeetNote-apk
          path: meeting-recorder/MeetNote.apk
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete meetnote-latest --cleanup-tag -y || true
          gh release create meetnote-latest MeetNote.apk --prerelease \
            --target "$GITHUB_SHA" --title "MeetNote (latest build)" \
            --notes "Commit ${GITHUB_SHA::7} · Build ${GITHUB_RUN_NUMBER}"
