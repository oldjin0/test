name: Build APK

on:
  push:
    branches: [ccr-4d8e098a-xfwocj]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # keeps the signing key in a private draft release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: manga-viewer-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Restore (or create once) the release signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          find_key() {
            # Oldest draft release named signing-key wins, so a race between two
            # runs still ends with every later build using the same key.
            gh api "repos/$REPO/releases" --paginate \
              -q '[.[] | select(.draft and .name=="signing-key")] | sort_by(.created_at) | .[0].assets[0].id // empty'
          }
          ASSET=$(find_key)
          if [ -z "$ASSET" ]; then
            echo "No signing key yet: creating one"
            mkdir -p /tmp/sign && cd /tmp/sign
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -keystore upload-keystore.jks -storetype PKCS12 \
              -alias upload -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Manga Viewer"
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$PASS" "$PASS" > key.properties
            tar czf signing.tgz upload-keystore.jks key.properties
            gh release create "signing-key-$(date +%s)" --repo "$REPO" --draft \
              --title signing-key --notes "Private release signing key. Do not publish or delete." \
              --target "${{ github.sha }}" signing.tgz
            cd "$GITHUB_WORKSPACE"
            ASSET=$(find_key)
          fi
          test -n "$ASSET"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$ASSET" > /tmp/signing.tgz
          tar xzf /tmp/signing.tgz -C android/app upload-keystore.jks
          tar xzf /tmp/signing.tgz -C android key.properties
          test -s android/app/upload-keystore.jks && test -s android/key.properties
      - run: flutter build apk --release
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - run: ls -l build/app/outputs/flutter-apk/ && sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: manga-viewer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          script: flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded || (adb logcat -d | grep -iE "flutter|tflite|litert|FATAL|AndroidRuntime|libc  |DEBUG   |lowmemorykiller|am_kill|Process .* died" | tail -250; exit 1)
