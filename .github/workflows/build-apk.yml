name: Build APK

on:
  push:
    branches: [ccr-4d8e098a-xfwocj]
    # Model tooling alone does not change the app.
    paths-ignore:
      - tools/**
      - docs/**
      - windows/**
      - .github/workflows/build-model.yml
      - .github/workflows/pc-*.yml
      - .github/workflows/bench.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # keeps the signing key in a private draft release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: manga-viewer-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Restore (or create once) the release signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          find_key() {
            # Oldest draft release named signing-key wins, so a race between two
            # runs still ends with every later build using the same key.
            gh api "repos/$REPO/releases" --paginate \
              -q '[.[] | select(.draft and .name=="signing-key")] | sort_by(.created_at) | .[0].assets[0].id // empty'
          }
          ASSET=$(find_key)
          if [ -z "$ASSET" ]; then
            echo "No signing key yet: creating one"
            mkdir -p /tmp/sign && cd /tmp/sign
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -keystore upload-keystore.jks -storetype PKCS12 \
              -alias upload -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Manga Viewer"
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$PASS" "$PASS" > key.properties
            tar czf signing.tgz upload-keystore.jks key.properties
            gh release create "signing-key-$(date +%s)" --repo "$REPO" --draft \
              --title signing-key --notes "Private release signing key. Do not publish or delete." \
              --target "${{ github.sha }}" signing.tgz
            cd "$GITHUB_WORKSPACE"
            ASSET=$(find_key)
          fi
          test -n "$ASSET"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$ASSET" > /tmp/signing.tgz
          tar xzf /tmp/signing.tgz -C android/app upload-keystore.jks
          tar xzf /tmp/signing.tgz -C android key.properties
          test -s android/app/upload-keystore.jks && test -s android/key.properties
      - name: Build release APKs (arm64 for phones, universal as fallback)
        run: |
          set -euo pipefail
          # The run number is the app's version code, so every release installs over the last.
          VER="--build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}"
          mkdir -p dist
          flutter build apk --release $VER
          cp build/app/outputs/flutter-apk/app-release.apk dist/manga-viewer-universal.apk
          flutter build apk --release $VER --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/manga-viewer-arm64.apk
          ls -l dist
      - name: Verify the APKs (persistent signing key, version code)
        run: |
          set -uo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # The 64 hex digits of a SHA-256 digest, whatever text or colons surround them.
          hex64() { tr -d ':' | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f'; }
          KEY_FP=$(keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$(grep '^storePassword=' android/key.properties | cut -d= -f2-)" \
            | grep -m1 "SHA-256" | hex64)
          echo "Stored key SHA-256: $KEY_FP"
          test -n "$KEY_FP"
          for APK in dist/*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1) || { echo "$OUT"; exit 1; }
            APK_FP=$(echo "$OUT" | grep -m1 -i "SHA-256 digest" | hex64)
            echo "$APK signer SHA-256: $APK_FP"
            test "$APK_FP" = "$KEY_FP"
            "$AAPT2" dump badging "$APK" | grep -m1 -o "versionCode='[0-9]*' versionName='[^']*'"
            "$AAPT2" dump badging "$APK" | grep -q "versionCode='${{ github.run_number }}'"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: manga-viewer-release-apk
          path: dist/*.apk

  # Publishes the APKs the app's updater downloads, only when the build and
  # the emulator test both passed.
  release:
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manga-viewer-release-apk
          path: dist
      - name: Publish release build-${{ github.run_number }}
        run: |
          set -euo pipefail
          # The token may not create a tag on a commit whose workflow files
          # differ from the branch head. That only happens when newer commits
          # changed workflows, and their own build publishes instead.
          HEAD=$(gh api "repos/$REPO/commits/${{ github.ref_name }}" -q .sha)
          CHANGED=$(gh api "repos/$REPO/compare/${{ github.sha }}...$HEAD" \
            -q '[.files[]?.filename | select(startswith(".github/workflows/"))] | length')
          if [ "$CHANGED" != "0" ]; then
            echo "::notice::Workflows changed after this commit; the newer build publishes the update."
            exit 0
          fi
          (cd dist && sha256sum manga-viewer-*.apk > SHA256SUMS && cat SHA256SUMS)
          git log -1 --format='%s%n%n%b' | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md || true
          gh release create "build-${{ github.run_number }}" \
            dist/manga-viewer-arm64.apk dist/manga-viewer-universal.apk dist/SHA256SUMS \
            --repo "$REPO" --target "${{ github.sha }}" --latest \
            --title "Manga Viewer 1.0.${{ github.run_number }}" --notes-file notes.md
      - name: Keep only the 3 newest builds
        run: |
          set -euo pipefail
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft,createdAt \
            -q '[.[] | select(.isDraft | not) | select(.tagName | startswith("build-"))]
                | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r TAG; do
            echo "Deleting old release $TAG"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          done

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          script: flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded || (adb logcat -d | grep -iE "flutter|tflite|litert|FATAL|AndroidRuntime|libc  |DEBUG   |lowmemorykiller|am_kill|Process .* died" | tail -250; exit 1)
